[project]
name = "{{AGENT_NAME}}"
version = "0.1.0"
description = "{{AGENT_DESCRIPTION}}"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "aiosqlite>=0.20.0",
    "langchain-deepseek>=0.1.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "langfuse>=2.0.0",
    "httpx>=0.27.0",
]

# Optional dependencies by interface:
#   web:     fastapi>=0.115.0, uvicorn[standard]>=0.30.0, jinja2>=3.1.0
#   telegram: python-telegram-bot>=21.0
#   cli:     (no extra deps)
#
# Optional dependencies by tool skill:
#   web-search:      (uses httpx)
#   file-system:     (no extra deps)
#   data-analysis:   pandas>=2.2.0, plotly>=5.24.0
#   code-interpreter:(no extra deps)
#   financial-data:  akshare

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
